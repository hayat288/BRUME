<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NUANCE</title>
    <link rel="stylesheet" href="style2.css">
</head>
<body>
    <header class="zone-header">
        HEADER (Logo - Nav - Cart)
    </header>
    <main class="zone-main">
        <section class="zone-intro">
            INTRO (02 Récapitulatif + Titre principal)
        </section>
        <div class="zone-content-grid">
            <div class="zone-left-column">
                <div class="zone-preview-card">
                    PREVIEW CARD (Image + Label)
                </div>
                <div class="zone-product-details">
                    PRODUCT DETAILS (Nom + Description + Bouton Modifier)
                </div>
            </div>
            <aside class="zone-right-column">
                SUMMARY CARD (Récapitulatif + Prix Total + Bouton Action)
            </aside>
        </div>
    </main>
    <footer class="zone-footer">
        FOOTER (Copyrights / Slogan)
    </footer>   
</body>
</html>
